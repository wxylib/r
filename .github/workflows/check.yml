name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Build
        run: R CMD build .
      - name: Check
        run: R CMD check --no-manual --as-cran wxy_*.tar.gz
        env:
          _R_CHECK_CRAN_INCOMING_: false
      - name: Show check log
        if: always()
        run: cat wxy.Rcheck/00check.log || true

[package]
name = "wxy"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
name = "wxy"

[dependencies]
extendr-api = "0.9"
# Pinned to a wxylib/core commit so the bindings move only when we say so.
wxy-domain = { git = "https://github.com/wxylib/core", rev = "caba7b2ff19cc97dde505eed6fae6145ef9692aa" }
wxy-source = { git = "https://github.com/wxylib/core", rev = "caba7b2ff19cc97dde505eed6fae6145ef9692aa" }
wxy-warp = { git = "https://github.com/wxylib/core", rev = "caba7b2ff19cc97dde505eed6fae6145ef9692aa" }
async-trait = "0.1.89"
futures = { version = "0.3.31", default-features = false, features = ["executor"] }

[profile.release]
lto = true
codegen-units = 1

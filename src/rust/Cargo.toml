[package]
name = "wxy"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
name = "wxy"

[dependencies]
extendr-api = "0.9"
# Pinned to a wxylib/core commit so the bindings move only when we say so.
wxy-domain = { git = "https://github.com/wxylib/core", rev = "39b07bba423e99a361ea0f02b0ed3e45521f2b1a" }
wxy-source = { git = "https://github.com/wxylib/core", rev = "39b07bba423e99a361ea0f02b0ed3e45521f2b1a" }
wxy-warp = { git = "https://github.com/wxylib/core", rev = "39b07bba423e99a361ea0f02b0ed3e45521f2b1a" }
async-trait = "0.1.89"
futures = { version = "0.3.31", default-features = false, features = ["executor"] }

[profile.release]
lto = true
codegen-units = 1
